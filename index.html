<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Découvrez les gourmandises de Maison Sandrine et commandez directement sur WhatsApp."
    />
    <title>Maison Sandrine | Boulangerie & Gourmandises</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="menu-container">
      <div class="language-switch">
        <button type="button" class="lang-button" data-lang="en">EN</button>
        <button type="button" class="lang-button active" data-lang="fr">
          FR
        </button>
      </div>

      <header class="restaurant-header">
        <p class="restaurant-label" data-i18n="welcome">BIENVENUE CHEZ</p>
        <h1><span id="business-name"></span><span>.</span></h1>
        <p class="restaurant-description" data-i18n="description"></p>
        <div class="opening-status" data-i18n="open"></div>
      </header>

      <section class="menu-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-i18n="menu">NOTRE MENU</p>
            <h2 data-i18n="choose"></h2>
          </div>
          <span class="menu-count" id="menu-count"></span>
        </div>

        <!-- Cards are generated by script.js -->
        <div id="menu-list"></div>
      </section>

      <section class="order-summary">
        <div class="summary-row">
          <span data-i18n="selected"></span>
          <span id="item-count">0</span>
        </div>

        <div class="summary-row total-row">
          <span data-i18n="total"></span>
          <strong id="total-price">0 FCFA</strong>
        </div>

        <textarea id="order-note" class="order-note" rows="2"></textarea>

        <button id="order-button" disabled>
          <span data-i18n="order"></span>
          <span>↗</span>
        </button>

        <p class="summary-note" data-i18n="note"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
